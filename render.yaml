# One-click deploy on Render: New > Blueprint > pick this repo.
services:
  - type: web
    name: two-halves
    runtime: node
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
